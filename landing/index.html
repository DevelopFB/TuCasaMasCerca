<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Casa +Cerca</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS — Tu Casa +Cerca (alineados al brandbook V1)
           ============================================================ */
        :root {
            /* Brand colors */
            --brand-primary: #1A4394;     /* Azul institucional — dominante */
            --brand-vivid:   #0D00FF;     /* Azul vibrante — acentos, hover, links */
            --brand-dark:    #1E1E1E;     /* Negro/gris oscuro — texto principal */
            --brand-mid:     #748082;     /* Gris medio — texto secundario */
            --brand-light:   #E1EAEB;     /* Gris claro — fondos suaves, separadores */
            --brand-white:   #FFFFFF;
            /* Estados */
            --brand-primary-hover: #143575;
            --brand-primary-soft:  rgba(26, 67, 148, 0.08);
            /* Sombras */
            --shadow-sm: 0 2px 8px rgba(26, 67, 148, 0.08);
            --shadow-md: 0 8px 24px rgba(26, 67, 148, 0.12);
            --shadow-lg: 0 20px 48px rgba(26, 67, 148, 0.18);
            /* Spacing escala */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --space-6: 48px;
            --space-8: 64px;
            --space-12: 96px;
            /* Padding seccion responsive */
            --section-py: clamp(48px, 8vw, 80px);
            --section-px: clamp(16px, 4vw, 24px);
            /* Transiciones */
            --transition-base: all .2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {font-family: 'Poppins', 'Inter', sans-serif; font-weight: 400; line-height: 1.6; color: var(--brand-dark); background: #fff; overflow-x: hidden; width: 100%;}
        header { background: #fff; border-bottom: 1px solid var(--brand-light); position: sticky; top: 0; z-index: 1000; padding: 16px 0; }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo img { height: 40px; width: auto; display: block; }
        .logo span { color: var(--brand-primary); }
        .brand { color: var(--brand-primary); }
        #landing-page nav { display: flex; gap: 32px; align-items: center; }
        #landing-page nav a { text-decoration: none; color: var(--brand-dark); font-size: 14px; font-weight: 500; }
        .btn-ingresar { background: var(--brand-primary); color: white; padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* Hamburger menu (oculto en desktop) */
        .hamburger {
            display: none;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-direction: column;
            justify-content: space-between;
            width: 36px;
            height: 28px;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 3px;
            background: var(--brand-primary);
            border-radius: 2px;
            transition: transform .3s ease, opacity .3s ease;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* Mobile nav */
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            #landing-page nav {
                display: none;
                position: absolute;
                top: 72px;
                left: 0;
                right: 0;
                background: white;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 16px 24px 24px;
                border-bottom: 1px solid var(--brand-light);
                box-shadow: var(--shadow-md);
                z-index: 999;
            }
            #landing-page nav.open { display: flex; }
            #landing-page nav a {
                padding: 14px 8px;
                font-size: 16px;
                border-bottom: 1px solid var(--brand-light);
            }
            #landing-page nav a:last-of-type { border-bottom: none; }
            #landing-page nav .btn-ingresar {
                margin-top: 12px;
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }
        }
        
        .hero { max-width: 1400px; margin: 0 auto; padding: var(--section-py) var(--section-px); display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
        .hero-content h1 { font-family: 'Poppins', sans-serif; font-size: clamp(32px, 5vw, 48px); font-weight: 700; margin-bottom: 20px; }
        .hero-content p { font-size: 18px; color: var(--brand-mid); margin-bottom: 32px; }
        
        .calculator-box { background: linear-gradient(135deg, #f5f5f5 0%, #fff 100%); padding: 40px; border-radius: 16px; border: 1px solid var(--brand-light); box-shadow: 0 4px 20px rgba(0, 82, 204, 0.08); }
        .calculator-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid var(--brand-light); border-radius: 8px; font-size: 14px; }
        
        .result-highlight { background: #f0f7ff; padding: 24px; border-radius: 12px; border-left: 4px solid var(--brand-primary); margin-top: 24px; }
        .result-amount { font-size: 32px; font-weight: 700; color: var(--brand-primary); margin: 12px 0; }
        .result-detail { font-size: 13px; color: #999; margin-bottom: 6px; }
        .result-detail strong { color: var(--brand-dark); }
        
        .btn-big { width: 100%; background: var(--brand-primary); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 24px; }
        
        .aspiracion { background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-vivid) 100%); color: white; padding: var(--section-py) var(--section-px); margin: 60px 0; text-align: center; }
        .aspiracion h2 { font-family: 'Poppins', sans-serif; font-size: clamp(28px, 5vw, 44px); font-weight: 600; margin-bottom: 20px; }
        
        .proceso-section { padding: var(--section-py) var(--section-px); background: #f9f9f9; }
        .section-title { font-family: 'Poppins', sans-serif; font-size: clamp(24px, 4vw, 36px); font-weight: 600; text-align: center; margin-bottom: 48px; }
        
        .pasos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 60px; }
        .paso { text-align: center; }
        .paso-numero { width: 56px; height: 56px; background: var(--brand-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-weight: 700; font-size: 24px; }
        
        .flujo { background: white; padding: 40px; border-radius: 12px; border: 1px solid var(--brand-light); }
        .flujo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 24px; }
        .flujo-item { padding: 20px; background: #f9f9f9; border-radius: 8px; border-left: 4px solid var(--brand-primary); }
        .flujo-item h4 { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--brand-primary); margin-bottom: 8px; }
        
        .casos { padding: var(--section-py) var(--section-px); }
        .casos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; }
        .caso-card { background: white; padding: 24px; border-radius: 12px; border: 2px solid var(--brand-light); }
        .caso-emoji { font-size: 40px; margin-bottom: 12px; }
        .caso-titulo { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        
        .plataforma { background: linear-gradient(135deg, #f9f9f9 0%, #f5f5f5 100%); padding: var(--section-py) var(--section-px); }
        .plat-titulo { font-family: 'Poppins', sans-serif; font-size: clamp(22px, 3.5vw, 32px); font-weight: 600; text-align: center; margin-bottom: 16px; }
        .plat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 48px; }
        .plat-card { background: white; padding: 32px; border-radius: 12px; border: 1px solid var(--brand-light); text-align: center; }
        .plat-icon { font-size: 40px; margin-bottom: 16px; }
        
        .tasas { padding: var(--section-py) var(--section-px); }
        .tasas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 48px; }
        .tasa-box { background: white; padding: 32px; border-radius: 12px; border: 1px solid var(--brand-light); }
        .tasa-table-row { display: grid; grid-template-columns: 1fr 1fr; padding: 10px 0; border-bottom: 1px solid var(--brand-light); font-size: 13px; }
        .tasa-value { color: var(--brand-primary); font-weight: 700; text-align: right; }
        
        .faq { padding: var(--section-py) var(--section-px); background: #f9f9f9; }
        .faq-container { max-width: 1000px; margin: 0 auto; }
        .faq-item { background: white; padding: 24px; margin-bottom: 12px; border-radius: 8px; }
        .faq-q { display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; color: var(--brand-mid); font-size: 13px; margin-top: 16px; }
        .faq-item.active .faq-answer { max-height: 500px; }
        
        .cta-final { background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-vivid) 100%); color: white; padding: var(--section-py) var(--section-px); text-align: center; }
        .cta-final h2 { font-family: 'Poppins', sans-serif; font-size: clamp(24px, 4vw, 36px); font-weight: 600; margin-bottom: 20px; }
        .btn-primary { background: white; color: var(--brand-primary); padding: 16px 48px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        footer { background: var(--brand-dark); color: white; padding: 48px 24px 24px; }
        .footer-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-bottom: 32px; }
        
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 40px; border-radius: 16px; width: 90%; max-width: 450px; }
        .modal-title { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 16px; }
        
        /* Iconos SVG line-style (alineados al brandbook) */
        .icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; }
        .icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .icon-lg { width: 32px; height: 32px; }
        .icon-xl { width: 48px; height: 48px; }
        .icon-sm { width: 18px; height: 18px; }
        /* hero-check con ícono SVG */
        .hero-check svg { width: 14px; height: 14px; stroke-width: 2.5; }
        /* badge-icon override */
        .badge-icon svg { width: 14px; height: 14px; stroke-width: 2.5; }
        /* prop-card-img como contenedor de ícono grande con fondo */
        .prop-card-img .icon { width: 48px; height: 48px; }
        .prop-card-img .icon svg { stroke: var(--brand-primary); }
        .cb-ben-icon { color: var(--brand-primary); }
        .cb-ben-icon .icon { width: 32px; height: 32px; }

        /* Tablet */
        @media (max-width: 1024px) {
            .pasos { grid-template-columns: repeat(2, 1fr); }
            .casos-grid { grid-template-columns: repeat(2, 1fr); }
            .plat-grid { grid-template-columns: repeat(2, 1fr); }
            .tasas-grid { grid-template-columns: 1fr; }
        }
        /* Mobile grande */
        @media (max-width: 768px) {
            .hero-inner { grid-template-columns: 1fr; }
            .hero { grid-template-columns: 1fr; padding: var(--section-py) var(--section-px); gap: 32px; }
            .calculator-wrapper { grid-template-columns: 1fr; gap: 16px; }
            .calculator-box { padding: 24px; }
            .pasos { grid-template-columns: 1fr; }
            .flujo { padding: 24px; }
            .flujo-grid { grid-template-columns: 1fr; gap: 16px; }
            .casos-grid { grid-template-columns: 1fr; }
            .plat-grid { grid-template-columns: 1fr; }
            .tasas-grid { grid-template-columns: 1fr; }
            .footer-container { grid-template-columns: repeat(2, 1fr); gap: 24px; }
            .modal-content { padding: 24px; margin: 10% auto; }
            .aspiracion { padding: var(--section-py) var(--section-px); margin: 32px 0; }
        }
        /* Mobile chico */
        @media (max-width: 520px) {
            .hero-content h1 { font-size: clamp(28px, 8vw, 38px) !important; }
            .calculator-box { padding: 16px; border-radius: 12px; }
            .footer-container { grid-template-columns: 1fr; }
            .cb-infografia { padding: 24px 16px; }
            .cb-stat { padding: 0 8px; min-width: 120px; }
            .faq-item { padding: 16px; }
            .testimonio-card { padding: 20px; }
            .plat-card, .tasa-box, .caso-card { padding: 20px; }
            .btn-primary, .btn-big { padding: 14px 24px; font-size: 15px; }
        }
    
        .hero-icons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 18px; }
        .hero-icon-item { display:flex; align-items:center; gap:10px; font-size: 13px; color:var(--brand-dark); }
        .hero-check { display:inline-flex; width: 22px; height: 22px; border-radius: 999px; align-items:center; justify-content:center; background:#e9f0ff; color:var(--brand-primary); font-weight: 600; }
        .btn-secondary { background: #f2f4f7; color: var(--brand-dark); padding: 12px 18px; border: 1px solid var(--brand-light); border-radius: 10px; cursor: pointer; font-weight: 600; }
        .bo-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        @media (max-width: 700px) { .bo-grid { grid-template-columns: 1fr; } .hero-icons { grid-template-columns: 1fr; } }

        /* COLDWELL BANKER SECTION */
        .cb-section { padding: var(--section-py) var(--section-px); background: white; }
        .cb-inner { max-width: 1000px; margin: 0 auto; text-align: center; }
        .cb-badge { display: inline-block; background: #e8f0fe; color: var(--brand-primary); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; padding: 6px 16px; border-radius: 999px; margin-bottom: 20px; }
        .cb-subtitle { color: var(--brand-mid); font-size: 16px; max-width: 680px; margin: 0 auto 48px; line-height: 1.7; }
        .cb-infografia { display: flex; align-items: center; justify-content: center; gap: 0; background: linear-gradient(135deg, #f0f7ff 0%, #e8f0fe 100%); border-radius: 16px; padding: 40px 32px; margin-bottom: 48px; flex-wrap: wrap; gap: 8px; }
        .cb-stat { text-align: center; padding: 0 20px; }
        .cb-stat-num { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 700; color: var(--brand-primary); }
        .cb-stat-label { font-size: 12px; color: var(--brand-mid); margin-top: 4px; }
        .cb-arrow { font-size: 24px; color: var(--brand-primary); opacity: 0.4; }
        .cb-beneficios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; text-align: left; }
        .cb-ben-item { display: flex; gap: 16px; align-items: flex-start; background: #f9f9f9; padding: 24px; border-radius: 12px; }
        .cb-ben-icon { font-size: 28px; flex-shrink: 0; }
        .cb-ben-item strong { display: block; font-size: 14px; margin-bottom: 6px; }
        .cb-ben-item p { font-size: 13px; color: var(--brand-mid); margin: 0; }

        /* PROPIEDADES CB */
        .propiedades-section { padding: var(--section-py) var(--section-px); background: #f9f9f9; }
        .prop-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .prop-filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .btn-cb-buscar { background: var(--brand-primary); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: var(--transition-base); }
        .btn-cb-buscar:hover { background: var(--brand-primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-cb-buscar:focus-visible { outline: 3px solid var(--brand-vivid); outline-offset: 2px; }
        .prop-preview { position: relative; }
        .prop-card-demo { background: white; border-radius: 12px; border: 1px solid var(--brand-light); padding: 0; overflow: hidden; margin-bottom: -20px; box-shadow: 0 4px 20px rgba(0,82,204,0.1); }
        .prop-card-img { background: linear-gradient(135deg, #e8f0fe, #f0f7ff); height: 200px; overflow: hidden; position: relative; }
        .prop-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
        .prop-card-demo:hover .prop-card-img img { transform: scale(1.05); }
        .prop-card-info { padding: 16px 20px; }
        .prop-card-tag { display: inline-block; background: #e8f0fe; color: var(--brand-primary); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
        .prop-card-info strong { display: block; font-size: 15px; }
        .prop-card-info p { font-size: 13px; color: var(--brand-mid); margin: 2px 0 8px; }
        .prop-card-price { font-size: 18px; font-weight: 700; color: var(--brand-primary); }

        /* TESTIMONIOS */
        .testimonios-section { padding: var(--section-py) var(--section-px); background: white; }
        .testimonios-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .testimonio-card { background: #f9f9f9; border-radius: 16px; padding: 32px; border: 1px solid var(--brand-light); }
        .testimonio-stars { color: #f59e0b; font-size: 18px; margin-bottom: 16px; letter-spacing: 2px; }
        .testimonio-texto { color: #444; font-size: 14px; line-height: 1.7; margin-bottom: 24px; font-style: italic; }
        .testimonio-autor { display: flex; gap: 12px; align-items: center; }
        .testimonio-avatar { width: 44px; height: 44px; background: var(--brand-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
        .testimonio-autor strong { display: block; font-size: 14px; }
        .testimonio-autor span { font-size: 12px; color: #888; }

        @media (max-width: 768px) {
            .cb-infografia { flex-direction: column; }
            .cb-arrow { transform: rotate(90deg); }
            .cb-beneficios { grid-template-columns: 1fr; }
            .prop-inner { grid-template-columns: 1fr; }
            .prop-filtros { grid-template-columns: 1fr; }
            .testimonios-grid { grid-template-columns: 1fr; }
            .prop-preview { display: none; }
        }
    

        /* ============================================================
           HOVER & FOCUS STATES — Accesibilidad y feedback visual
           ============================================================ */
        .btn-ingresar, .btn-big, .btn-primary, .btn-secondary, .btn-cb-buscar {
            transition: var(--transition-base);
        }
        .btn-ingresar:hover { background: var(--brand-primary-hover); transform: translateY(-1px); }
        .btn-big:hover { background: var(--brand-primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.18); }
        .btn-secondary:hover { background: var(--brand-light); border-color: var(--brand-mid); }
        .btn-ingresar:focus-visible, .btn-big:focus-visible, .btn-primary:focus-visible,
        .btn-secondary:focus-visible, .btn-cb-buscar:focus-visible {
            outline: 3px solid var(--brand-vivid);
            outline-offset: 2px;
        }

        /* Cards interactivas */
        .caso-card, .testimonio-card, .plat-card, .tasa-box {
            transition: var(--transition-base);
        }
        .caso-card:hover, .testimonio-card:hover, .plat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--brand-primary);
        }

        /* Links y navegación */
        #landing-page nav a {
            transition: color .2s ease;
            position: relative;
        }
        #landing-page nav a:hover { color: var(--brand-primary); }
        #landing-page nav a:focus-visible { outline: 2px solid var(--brand-vivid); outline-offset: 4px; border-radius: 4px; }

        /* Footer links */
        footer a { color: rgba(255,255,255,0.85); text-decoration: none; transition: opacity .2s ease; }
        footer a:hover { opacity: 0.7; text-decoration: underline; text-underline-offset: 4px; }

        /* Inputs focus */
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(26, 67, 148, 0.15);
        }

        /* Skip link (accesibilidad) */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            background: var(--brand-vivid);
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            z-index: 9999;
            border-radius: 0 0 8px 0;
        }
        .skip-link:focus { left: 0; }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== APP-ROOT RESET: neutralizar estilos del landing ===== */
        #app-root { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
        #app-root nav { display: block; gap: 0; align-items: initial; }
        #app-root nav a { color: inherit; font-size: inherit; font-weight: inherit; }
        #app-root aside { z-index: 100; }
        #app-root input, #app-root select, #app-root textarea {
            padding: initial; border: initial; border-radius: initial; font-size: inherit;
        }
        #app-root button { border: none; cursor: pointer; background: transparent; font: inherit; color: inherit; padding: 0; }
        #app-root *, #app-root *::before, #app-root *::after { box-sizing: border-box; }

        /* ===== HERO POR CAPAS (fintech moderno) ===== */
        :root{
            --blue: #0052CC;
            --blue-deep: #0041A3;
            --ink: #1A1A1A;
            --muted: #666666;
            --bg-soft: #F5F7FB;
            --card-border: rgba(0,0,0,.06);
            --shadow-md: 0 18px 40px rgba(0,0,0,.10);

    <div id="backofficeModal" class="modal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-title">Backoffice — Configuración de Tasas</div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px;">
                <div class="form-group">
                    <label>Máximo Loan-to-Value / LTV (% sobre valor del inmueble)</label>
                    <input id="bo-maxLtv" type="number" min="1" max="100" step="0.1">

            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee;">
                <div style="font-weight:700; margin: 6px 0 10px;">Tasas base (anual) por plazo</div>

                    <div class="form-group">
                        <label>12 meses</label>

                        <input id="bo-rate-24" type="number" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>36 meses</label>
                        <input id="bo-rate-36" type="number" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>48 meses</label>
                        <input id="bo-rate-48" type="number" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>60 meses</label>
                        <input id="bo-rate-60" type="number" step="0.01" min="0">
                    </div>

                <button type="button" class="btn-secondary" onclick="resetBackoffice()">Reset</button>
                <button type="button" class="btn-big" onclick="saveBackoffice()">Guardar</button>
            </div>

<script>
        const DEFAULT_CONFIG = {
            tasasBase: { 12: 0.105, 24: 0.115, 36: 0.125, 48: 0.135, 60: 0.145 },
            maxLTV: 0.35,
            maxLoan: 50000
        };

        function loadConfig() {
            try {
                const raw = localStorage.getItem('tcmc_config');
                if (!raw) return structuredClone(DEFAULT_CONFIG);
                const cfg = JSON.parse(raw);

                // Merge defensivo
                const merged = structuredClone(DEFAULT_CONFIG);
                if (cfg && typeof cfg === 'object') {
                    if (cfg.tasasBase && typeof cfg.tasasBase === 'object') {
                        for (const k of Object.keys(merged.tasasBase)) {
                            if (typeof cfg.tasasBase[k] === 'number' && isFinite(cfg.tasasBase[k])) merged.tasasBase[k] = cfg.tasasBase[k];
                        }
                    }
                    if (typeof cfg.maxLTV === 'number' && isFinite(cfg.maxLTV)) merged.maxLTV = cfg.maxLTV;
                    if (typeof cfg.maxLoan === 'number' && isFinite(cfg.maxLoan)) merged.maxLoan = cfg.maxLoan;
                }
                return merged;
            } catch (e) {
                return structuredClone(DEFAULT_CONFIG);
            }
        }

        function saveConfig(cfg) {
            localStorage.setItem('tcmc_config', JSON.stringify(cfg));
        }

        let CONFIG = loadConfig();


        // --- Última cotización (para lead) ---
        let LAST_QUOTE = null;

        function setLastQuote(data) {
            LAST_QUOTE = data;
        }

        function fillLeadQuote() {
            const q = LAST_QUOTE;
            const fmtMoney0 = (n) => '$' + Math.round(n).toLocaleString('es-AR');
            const fmtMoney2 = (n) => '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (!q) return;

            document.getElementById('leadProp').textContent = fmtMoney0(q.propertyValue);
            document.getElementById('leadLoan').textContent = fmtMoney0(q.loanAmount);
            document.getElementById('leadTerm').textContent = q.termMonths + ' meses';
            document.getElementById('leadCuota').textContent = fmtMoney2(q.cuota);
            document.getElementById('leadTna').textContent = (q.tasaAnual * 100).toFixed(2) + '%';
        }

        // ---- Modal Lead ----
        const leadModal = document.getElementById('leadModal');
        function openLeadModal() {
            fillLeadQuote();
            leadModal.style.display = 'block';
        }
        function closeLeadModal() { leadModal.style.display = 'none'; }



        function calcularCuota(tasaAnual, meses, montoBruto) {
            const tm = tasaAnual / 12;
            if (tm === 0) return montoBruto / meses;
            const num = montoBruto * (tm * Math.pow(1 + tm, meses));
            const den = Math.pow(1 + tm, meses) - 1;
            return num / den;
        }

        function calcularTNA(cuotaMensual, meses, prestamo) {
            // TD: (Total pagado / Principal solicitado) - 1
            // TNA anualizada según Excel (compuesta): (1+TD)^(12/meses)-1
            const td = (cuotaMensual * meses) / prestamo - 1;
            return Math.pow(1 + td, 12 / meses) - 1;
        }

        function calcularBruto(prestamo) {
            const upfront = prestamo * 0.05;
            const iva = upfront * 0.21;
            return prestamo + upfront + iva;
        }

        function updateCalculator() {
            const prop = parseInt(document.getElementById('property-value').value) || 100000;
            let loan = parseInt(document.getElementById('loan-amount').value) || 30000;
            const months = parseInt(document.getElementById('loan-term').value) || 36;

            const maxPct = Math.floor(prop * CONFIG.maxLTV);
            const maxAllow = Math.min(CONFIG.maxLoan, maxPct);
            if (loan > maxAllow) loan = maxAllow;

            // feedback en inputs
            const loanInput = document.getElementById('loan-amount');
            loanInput.max = maxAllow;
            loanInput.value = loan;

            const bruto = calcularBruto(loan);
            const tasa = CONFIG.tasasBase[months] ?? 0.085;
            const cuota = calcularCuota(tasa, months, bruto);
            const tnaCalc = calcularTNA(cuota, months, loan);

            document.getElementById('cuota').textContent = '$' + cuota.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('tna').textContent = (tasa * 100).toFixed(2) + '%';
            document.getElementById('ask').textContent = '$' + loan.toLocaleString('es-AR');
            document.getElementById('bruto').textContent = '$' + Math.round(bruto).toLocaleString('es-AR');
            document.getElementById('recv').textContent = '$' + loan.toLocaleString('es-AR');

            // guardar última cotización
            setLastQuote({
                propertyValue: prop,
                loanAmount: loan,
                termMonths: months,
                bruto,
                tasaAnual: tasa,
                cuota,
                tasaAnual: tasa,
                tir: tnaCalc,
                ts: new Date().toISOString()
            });
        }

        function updateExamples() {
            const baseLoan = 30000;
            const bruto = calcularBruto(baseLoan);

            [12,24,36,48,60].forEach(meses => {
                const tasa = CONFIG.tasasBase[meses] ?? 0.085;
                const cuota = calcularCuota(tasa, meses, bruto);
                const tna = calcularTNA(cuota, meses, baseLoan);

                const cuotaEl = document.getElementById(`ex-cuota-${meses}`);
                const tnaEl = document.getElementById(`ex-tna-${meses}`);
                if (cuotaEl) cuotaEl.textContent = '$' + cuota.toLocaleString('es-AR', { maximumFractionDigits: 0 });
                if (tnaEl) tnaEl.textContent = (tna * 100).toFixed(2) + '%';
            });
        }

        function buscarEnCB() {
            const zona = document.getElementById('cb-zona').value;
            const tipo = document.getElementById('cb-tipo').value;
            const precio = document.getElementById('cb-precio').value;
            let url = 'https://www.coldwellbanker.com.ar/propiedades?';
            const params = ['suitable_for_credit=1']; // filtro por defecto: solo aptas credito Tu Casa +Cerca
            if (zona) params.push('zona=' + encodeURIComponent(zona));
            if (tipo) params.push('tipo=' + encodeURIComponent(tipo));
            if (precio) params.push('precio_hasta=' + encodeURIComponent(precio));
            url += params.join('&');
            window.open(url, '_blank');
        }

        // ---- Modal "Ingresar" ----
        const modal = document.getElementById('modal');
        // Mobile menu toggle
        function toggleMobileMenu() {
            const nav = document.getElementById('mainNav');
            const btn = document.getElementById('hamburger');
            const isOpen = nav.classList.toggle('open');
            btn.classList.toggle('open', isOpen);
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }
        function closeMobileMenu() {
            const nav = document.getElementById('mainNav');
            const btn = document.getElementById('hamburger');
            nav.classList.remove('open');
            btn.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
        }

        // Handoff a la app productiva (ver /shared/CONTRACT.md)
        const APP_URL = window.APP_URL || 'https://app.tucasamascerca.com';
        function openModal() {
            const params = new URLSearchParams();
            const prop = document.getElementById('property-value')?.value;
            const loan = document.getElementById('loan-amount')?.value;
            const months = document.getElementById('loan-term')?.value;
            if (prop) params.set('propertyValue', prop);
            if (loan) params.set('loanAmount', loan);
            if (months) params.set('months', months);
            const qs = params.toString();
            window.location.href = APP_URL + '/login' + (qs ? '?' + qs : '');
        }
        function closeModal() { modal.style.display = 'none'; }

        // ---- Backoffice ----
        const backofficeModal = document.getElementById('backofficeModal');
        function openBackoffice() {
            // cargar valores
            document.getElementById('bo-maxLtv').value = (CONFIG.maxLTV * 100).toFixed(1);
            document.getElementById('bo-maxLoan').value = CONFIG.maxLoan;

            [12,24,36,48,60].forEach(m => {
                const el = document.getElementById(`bo-rate-${m}`);
                if (el) el.value = (CONFIG.tasasBase[m] * 100).toFixed(2);
            });

            backofficeModal.style.display = 'block';
        }
        function closeBackoffice() { backofficeModal.style.display = 'none'; }

        function resetBackoffice() {
            CONFIG = structuredClone(DEFAULT_CONFIG);
            saveConfig(CONFIG);
            updateCalculator();
            updateExamples();
            openBackoffice();
        }

        function saveBackoffice() {
            const maxLtvPct = parseFloat(document.getElementById('bo-maxLtv').value);
            const maxLoan = parseFloat(document.getElementById('bo-maxLoan').value);

            const tasasBase = {};
            [12,24,36,48,60].forEach(m => {
                const v = parseFloat(document.getElementById(`bo-rate-${m}`).value);
                tasasBase[m] = isFinite(v) ? (v / 100) : DEFAULT_CONFIG.tasasBase[m];
            });

            const next = {
                tasasBase,
                maxLTV: isFinite(maxLtvPct) ? (maxLtvPct / 100) : DEFAULT_CONFIG.maxLTV,
                maxLoan: isFinite(maxLoan) ? maxLoan : DEFAULT_CONFIG.maxLoan
            };

            CONFIG = next;
            saveConfig(CONFIG);
            updateCalculator();
            updateExamples();
            closeBackoffice();
            alert('Configuración guardada.');
        }

        window.onclick = (e) => {
            if (e.target === modal) closeModal();
            if (e.target === leadModal) closeLeadModal();
            if (e.target === backofficeModal) closeBackoffice();
        };

        // Lead form submit (demo: consola + localStorage)
        document.getElementById('leadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('leadNombre').value.trim(),
                apellido: document.getElementById('leadApellido').value.trim(),
                telefono: document.getElementById('leadTelefono').value.trim(),
                email: document.getElementById('leadEmail').value.trim(),
                quote: LAST_QUOTE
            };

            try {
                const key = 'tcmc_leads';
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                arr.push(payload);
                localStorage.setItem(key, JSON.stringify(arr));
            } catch (err) {}

            console.log('Lead generado (demo):', payload);
            alert('¡Listo! Un agente se va a contactar con vos.');
            closeLeadModal();
            e.target.reset();
        });

        // FAQ
        function toggleFaq(el) { el.parentElement.classList.toggle('active'); }

        // smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', (e) => {
                const href = a.getAttribute('href');
                if (!href || href === '#') return;
                e.preventDefault();
                const t = document.querySelector(href);
                if (t) t.scrollIntoView({ behavior: 'smooth' });
            });
        });

        document.getElementById('property-value').addEventListener('input', () => { updateCalculator(); });
        document.getElementById('loan-amount').addEventListener('input', () => { updateCalculator(); });
        document.getElementById('loan-term').addEventListener('change', () => { updateCalculator(); });

        // init
        updateCalculator();
        updateExamples();
    </script>
